<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} – Harry Potter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand harry-font" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='img/brand.png') }}" alt="" width="42"> Harry Potter
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Menü megnyitása"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Főoldal</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('books') }}">Könyvek</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('films') }}">Filmek</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('houses') }}">Házak</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container page-content">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
